name: CI

# Checks every pull request and every push to main:
#   - formatting and lints, on macOS (the system the app is developed on)
#   - unit tests, on Windows, Linux and macOS
#
# Safe for pull requests from forks: read-only access, no secrets, and the
# `pull_request` trigger (never `pull_request_target`, which would hand a stranger's
# code this repository's permissions).

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A newer push to the same branch or pull request cancels the older run.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    name: Format and lint
    # Lints run on macOS only: a few items are used on one system and would be reported
    # as unused on the others.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Update Rust
        run: rustup update stable && rustup default stable && rustup component add rustfmt clippy

      - name: Formatting
        run: cargo fmt --check

      - name: Lints
        run: cargo clippy --locked -- -D warnings

  test:
    name: Test (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows
            os: windows-latest
          - name: linux
            os: ubuntu-latest
          - name: macos
            os: macos-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Update Rust
        run: rustup update stable && rustup default stable

      - name: Install Linux build libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libwayland-dev libgl1-mesa-dev \
            libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev

      # Unit tests only. The live edit tests need a server and stay off here
      # (they run when CACHE_DECK_TEST_PORT is set).
      - name: Tests
        run: cargo test --locked
